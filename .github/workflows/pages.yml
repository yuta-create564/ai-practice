# sentence-app フォルダを GitHub Pages で公開する(main ブランチに入ったとき、または手動実行)
name: アプリを公開
on:
  push:
    branches: [main]
    paths: ['sentence-app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sentence-app
      - id: deployment
        uses: actions/deploy-pages@v4
